# @package _global_

dataset:
  name: "tiny_imagenet"
  class_path: data_loading.data_modules.TinyImageNetDataModule
  dataset_splits: "${oc.env:tiny_imagenet_chosen_split_path,${hydra:runtime.cwd}/local_artifacts/splits/tiny_imagenet/random_n2_seed42.json}"
  
  # Arguments passed to datamodule __init__
  args:
    root: "${oc.env:tiny_imagenet_data_root,${hydra:runtime.cwd}/local_data}"
    # other dataset specific settings?

fed:
  rounds: 100

training:
  task_type: "classification"
  num_classes: 200
  loss: cross_entropy
  batch_size: 64
  lr: 1e-2
  local_steps: 1
  steps_or_epochs: epochs
  scheduler: none
  lr_min: 1e-5
  optimizer:
    class_name: SGD
    args:
      momentum: 0.9
      weight_decay: 0.0
