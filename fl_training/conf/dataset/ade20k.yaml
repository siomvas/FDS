# @package _global_

dataset:
  name: "ade20k"
  class_path: data_loading.data_modules.ADE20KDataModule
  dataset_splits: "${oc.env:ade20k_chosen_split_path}"
  
  # Arguments passed to __init__
  args:
    data_dir: "${oc.env:DATASETS_ROOT}/ade20k"
    split_file: "${oc.env:ade20k_chosen_split_path}"
  
training:
  task_type: "segmentation"
  num_classes: 150
  loss: dice_loss