# @package _global_

# -----------------------------------------------------------------------------
# 1. Menu Selection
# -----------------------------------------------------------------------------
defaults:
  - _self_
  - dataset: tiny_imagenet
  - model: resnet18

# -----------------------------------------------------------------------------
# 2. Experiment Identification
# -----------------------------------------------------------------------------

seed: 99
name: "${dataset.name}_${model.name}_${fed.method}_seed_${seed}"


# -----------------------------------------------------------------------------
# 3. FL Layer Settings
# -----------------------------------------------------------------------------
fed:
  method: fedavg
  rounds: 80
  n_clients: 6

  args: {} # Additional arguments for the FL method can be added here

# -----------------------------------------------------------------------------
# 4. Training Hyperparameters (overriden by dataset and model configs)
# -----------------------------------------------------------------------------
training:

  loss: cross_entropy
  lr: 5e-4
  batch_size: 64
  local_steps: 400 # can be steps or epochs, depending on steps_or_epochs
  steps_or_epochs: steps
  scheduler: onecycle
  optim_resume: resume
  lr_min: 1e-5
  grad_clipping_type: none
  grad_clipping_value: 0.0
  amp_enabled: true
  grad_tracking: false # needs grad_tracking controller, to be implemented
  # Detection evaluation threshold defaults
  detection_score_threshold: 0.5
  detection_map_iou_threshold: 0.5
  # Segmentation label validation policy: "error" (fail-fast) or "ignore"
  segmentation_out_of_range_policy: error
  optimizer:
    class_name: Adam
    args: {}

# -----------------------------------------------------------------------------
# 5. System & Paths
# -----------------------------------------------------------------------------
system:
  gpu_ids: [0]

paths:
  output_dir: "${hydra:runtime.cwd}/outputs"
  data_loading_root: "../data_loading"
