# @package _global_
model:
  name: deeplabv3_resnet50
  provider: torchvision
  args:
    weights: DeepLabV3_ResNet50_Weights.COCO_WITH_VOC_LABELS_V1
    weights_backbone: null

training:
  lr: 4.462965193984174e-05
  batch_size: 4
  scheduler: cosine
  optimizer:
    class_name: AdamW
    args:
      weight_decay: 0.00010234321271245017
