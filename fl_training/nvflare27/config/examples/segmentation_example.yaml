# FDS Segmentation Experiment Example
# Task: ADE20K semantic segmentation with DeepLabV3

experiment:
  name: "ade20k_segmentation_baseline"
  task_type: "segmentation"
  dataset: "ade20k"
  dataset_splits: "/path/to/ade20k_splits.json"

federated_learning:
  num_rounds: 20
  num_clients: 5
  aggregator: "fedavg"
  aggregator_config: {}
  min_clients: 4
  wait_time: 15

training:
  model: "deeplabv3_resnet50"
  local_epochs: 2
  batch_size: 16  # Smaller for segmentation
  learning_rate: 0.0001
  optimizer: "adam"
  amp_enabled: true
  grad_tracking: false
  seed: 42

resources:
  client_gpu_mem: "8GB"  # More memory for segmentation
  server_cpu: 2
