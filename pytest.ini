[pytest]
# Pytest configuration for FDS test suite

# Test discovery patterns
python_files = test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
testpaths = tests

# Markers for organizing tests
markers =
    slow: marks tests as slow (feature-based metrics, model downloads, deselect with '-m "not slow"')
    unit: marks tests as unit tests (fast, no I/O, preferred for rapid development)
    integration: marks tests as integration tests (cross-component workflows, end-to-end)
    property: marks property-based tests using Hypothesis framework
    gpu: marks tests requiring GPU (deselect with '-m "not gpu"' on CPU-only machines)

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -ra

# Logging
log_cli = false
log_cli_level = INFO

# Hypothesis settings (for property-based tests)
# Uncomment to override defaults:
# --hypothesis-show-statistics

# Performance options
# For parallel execution (if pytest-xdist is installed):
# -n auto
# For test timeouts (if pytest-timeout is installed):
# timeout = 300
