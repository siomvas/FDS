name: Mirror to Public Repo

on:
  push:
    branches: ['**']
  delete:
    branches: ['**']

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to public repo
        run: |
          git remote add public https://x-access-token:${{ secrets.MIRROR_TOKEN }}@github.com/ngol0/FDS-public.git
          git push public --mirror
