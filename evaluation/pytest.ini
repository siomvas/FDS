[pytest]
# Pytest configuration for metric tests

# Test discovery patterns
python_files = metric_tests.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    slow: marks tests as slow (feature-based metrics, deselect with '-m "not slow"')
    unit: marks tests as unit tests (fast, no I/O)
    integration: marks tests as integration tests

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Logging
log_cli = false
log_cli_level = INFO

# Coverage options (if pytest-cov is installed)
# Uncomment to enable coverage reporting
# addopts = --cov=metrics --cov-report=html --cov-report=term

# Timeout (if pytest-timeout is installed)
# Uncomment to set test timeout
# timeout = 300

# Parallel execution (if pytest-xdist is installed)
# Uncomment to enable parallel test execution
# addopts = -n auto
